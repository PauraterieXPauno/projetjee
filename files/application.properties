# --- Base H2 ---
# Persistante (fichier) :
spring.datasource.url=jdbc:h2:file:./data/bde
# En mémoire (données perdues à l'arrêt) : décommenter la ligne suivante
# spring.datasource.url=jdbc:h2:mem:bde
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Hibernate génère le schéma depuis les entités ---
# update      : crée/met à jour les tables sans effacer les données (dev)
# create-drop : recrée tout à chaque démarrage (base en mémoire / tests)
# validate    : vérifie seulement (prod, avec Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Données initiales (data.sql) exécutées APRÈS la création des tables ---
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Console H2 : http://localhost:8080/h2-console ---
spring.h2.console.enabled=true

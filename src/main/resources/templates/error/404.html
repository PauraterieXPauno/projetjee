<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Page introuvable')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5">
    <div class="card mx-auto" style="max-width: 42rem;">
        <div class="card-body text-center p-5">
            <div class="display-3 fw-bold text-warning">404</div>
            <h1 class="h3 fw-bold mt-2">Ressource introuvable</h1>
            <p class="text-muted" th:text="${message != null ? message : 'La page ou la ressource demandée est introuvable.'}">
                La ressource demandée n'existe pas.
            </p>
            <div class="d-flex justify-content-center gap-2 mt-4">
                <a class="btn btn-primary" th:href="@{/}">Retour au tableau de bord</a>
                <a class="btn btn-outline-secondary" href="javascript:history.back()">Page précédente</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

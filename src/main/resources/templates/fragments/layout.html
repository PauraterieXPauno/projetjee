<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' · BDE Manager'">BDE Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark">BDE</span>
            <span>Manager</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navigationPrincipale" aria-controls="navigationPrincipale"
                aria-expanded="false" aria-label="Ouvrir la navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navigationPrincipale">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${navActif == 'accueil'} ? 'active'"
                       th:href="@{/}"><i class="bi bi-grid-1x2 me-1"></i>Tableau de bord</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${navActif == 'membres'} ? 'active'"
                       th:href="@{/membres}"><i class="bi bi-people me-1"></i>Membres</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${navActif == 'evenements'} ? 'active'"
                       th:href="@{/evenements}"><i class="bi bi-calendar-event me-1"></i>Événements</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${navActif == 'tresorerie'} ? 'active'"
                       th:href="@{/tresorerie}"><i class="bi bi-cash-stack me-1"></i>Trésorerie</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${navActif == 'documents'} ? 'active'"
                       th:href="@{/documents}"><i class="bi bi-files me-1"></i>Documents</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${navActif == 'dossiers'} ? 'active'"
                       th:href="@{/dossiers}"><i class="bi bi-folder2-open me-1"></i>Dossiers</a>
                </li>
            </ul>
            <a class="btn btn-sm btn-accent" th:href="@{/tresorerie/nouveau}">
                <i class="bi bi-plus-lg me-1"></i>Nouvelle opération
            </a>
        </div>
    </div>
</nav>

<div th:fragment="flash">
    <div th:if="${succes}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${succes}">Opération réussie.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div th:if="${erreur}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erreur}">Une erreur est survenue.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
</div>

<footer th:fragment="footer" class="app-footer mt-auto">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
        <span>BDE Manager · Back-office associatif <span th:text="${anneeCourante}">2026</span></span>
        <div class="d-flex gap-3 align-items-center">
            <span class="text-muted small">Spring Boot · JPA · Thymeleaf · H2</span>
            <a class="footer-link" th:href="@{/h2-console}" target="_blank" rel="noopener">
                <i class="bi bi-database me-1"></i>Console H2
            </a>
        </div>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

<span th:fragment="badgeDocument(statut)" class="badge statut-badge"
      th:classappend="${'statut-' + #strings.toLowerCase(statut.toString())}"
      th:text="${statut.libelle}">Statut</span>

<span th:fragment="badgeEvenement(statut)" class="badge statut-badge"
      th:classappend="${'statut-' + #strings.toLowerCase(statut.toString())}"
      th:text="${statut.libelle}">Statut</span>

<span th:fragment="badgeLigne(statut)" class="badge statut-badge"
      th:classappend="${'statut-' + #strings.toLowerCase(statut.toString())}"
      th:text="${statut.libelle}">Statut</span>

<span th:fragment="badgeTypeLigne(type)" class="badge"
      th:classappend="${type.toString() == 'RECETTE'} ? 'text-bg-success-soft' : 'text-bg-danger-soft'"
      th:text="${type.libelle}">Type</span>

<span th:fragment="badgeTypeDocument(type)" class="badge text-bg-light border"
      th:text="${type.libelle}">Type</span>

</body>
</html>

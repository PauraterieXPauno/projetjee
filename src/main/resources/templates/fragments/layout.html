<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre}">Titre</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<nav th:fragment="menu" class="menu bg-primary flex-shrink-0 p-3">
    <a class="d-block fs-4 text-white text-decoration-none mb-3 px-3" th:href="@{/}">Association</a>
    <ul class="nav nav-pills flex-column gap-1">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/}" th:classappend="${page == 'accueil'} ? 'active'">Accueil</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/evenements}" th:classappend="${page == 'evenements'} ? 'active'">Événements</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/tresorerie}" th:classappend="${page == 'tresorerie'} ? 'active'">Trésorerie</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/administratif}" th:classappend="${page == 'administratif'} ? 'active'">Administratif</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/utilisateurs}" th:classappend="${page == 'utilisateurs'} ? 'active'">Utilisateurs</a>
        </li>
    </ul>
</nav>
</body>
</html>

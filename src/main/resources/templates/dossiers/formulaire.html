<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titrePage})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 py-lg-5">
    <div class="page-header">
        <div>
            <div class="page-kicker">Mini-Drive</div>
            <h1 class="page-title" th:text="${titrePage}">Nouveau dossier</h1>
            <p class="page-subtitle">Regroupez les documents administratifs dans un dossier thématique.</p>
        </div>
        <a class="btn btn-outline-secondary"
           th:href="${dossierId != null} ? @{/dossiers/{id}(id=${dossierId})} : @{/dossiers}">
            <i class="bi bi-arrow-left me-1"></i>Retour
        </a>
    </div>

    <div class="card">
        <div class="card-body p-4">
            <form method="post" th:action="${action}" th:object="${dossierForm}">
                <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
                    <div class="fw-bold mb-1">Le formulaire contient des erreurs.</div>
                    <ul class="mb-0 small">
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Erreur</li>
                    </ul>
                </div>

                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label" for="nom">Nom du dossier <span class="text-danger">*</span></label>
                        <input class="form-control" id="nom" type="text" th:field="*{nom}"
                               th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'"
                               placeholder="Comptabilité 2025-2026">
                        <div class="invalid-feedback" th:errors="*{nom}">Nom invalide.</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="categorie">Catégorie <span class="text-danger">*</span></label>
                        <input class="form-control" id="categorie" type="text" th:field="*{categorie}"
                               th:classappend="${#fields.hasErrors('categorie')} ? 'is-invalid'"
                               placeholder="Trésorerie">
                        <div class="invalid-feedback" th:errors="*{categorie}">Catégorie invalide.</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="description">Description</label>
                        <textarea class="form-control" id="description" rows="4" th:field="*{description}"
                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                  placeholder="Contenu et objectif du dossier…"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}">Description invalide.</div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a class="btn btn-outline-secondary"
                       th:href="${dossierId != null} ? @{/dossiers/{id}(id=${dossierId})} : @{/dossiers}">Annuler</a>
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-check-lg me-1"></i>Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

spring.application.name=BDE Manager

# Serveur
server.port=8080

# Base H2 en mode fichier, persistante dans le projet
spring.datasource.url=jdbc:h2:file:./data/bdedb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Paris

# Console H2 : http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.mvc.format.date=yyyy-MM-dd
spring.web.locale=fr_FR
spring.web.locale-resolver=fixed

# Données de démonstration (uniquement si la base est vide)
app.seed.enabled=true
